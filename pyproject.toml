[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "raftwire"
version = "0.1.0"
description = "Raft / write-ahead-log binary and text protocol toolkit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "raftwire contributors" },
]
keywords = [
    "raft",
    "wal",
    "consensus",
    "serialization",
    "framing",
    "log-compaction",
    "distributed-systems",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
raftwire = "raftwire.cli:main"

[project.urls]
Homepage = "https://github.com/example/raftwire"
Documentation = "https://github.com/example/raftwire#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/raftwire"]

[tool.hatch.build.targets.wheel.sources]
"src/raftwire" = "raftwire"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "fuzz: longer round-trip / randomized tests",
]

[tool.coverage.run]
source = ["raftwire"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
